appId: com.dsh.desktop
productName: DeepSeek Harness Desktop
copyright: MIT License
directories:
  buildResources: build
  output: release

files:
  - dist/**/*
  - renderer/**/*
  - build/icons/**/*
  - package.json
  - "!**/*.map"

# dsh 子进程用 ELECTRON_RUN_AS_NODE 运行内置 @deepseek-ai/dsh，
# 原生插件（koffi/node-pty/sharp 等）必须落在 asar 之外才能被 dlopen。
asarUnpack:
  - node_modules/@deepseek-ai/dsh/**
  - node_modules/node-addon*/**/*
  - node_modules/koffi/**
  - node_modules/@koromix/**
  - node_modules/node-pty/**
  - node_modules/sharp/**
  - node_modules/@img/**

# 保持 npm 安装时的 prebuilt 二进制原样（与 Electron 37 内嵌 Node 22.16 的 ABI 对齐），
# 不针对 Electron ABI 重编译；若本机 Node ABI 不匹配，运行时自动回退到系统 node。
npmRebuild: false

win:
  icon: build/icon.png
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DeepSeek Harness Desktop
  artifactName: ${productName}-Setup-${version}.${ext}

mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  target:
    - dmg

linux:
  icon: build/icon.png
  category: Development
  target:
    - AppImage

publish: null
